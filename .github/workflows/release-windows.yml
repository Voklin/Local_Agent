name: Publish Windows installer
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate release intent and avoid overwriting a published version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = Get-Content packaging/release.json | ConvertFrom-Json
          $package = Get-Content apps/desktop/package.json | ConvertFrom-Json
          if ($release.version -ne $package.version) { throw 'Release/package version mismatch' }
          gh release view "v$($release.version)" --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Version already published; use a new version' }
          exit 0
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests/migration -v
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: python tools/prepare_windows_dependencies.py
      - run: node tests/electron/desktop-apps.cjs
      - run: python tools/build_windows_core.py
      - name: Test frozen Core
        shell: pwsh
        run: |
          $env:LCA_TEST_CORE = (Resolve-Path build/core/lca-core/lca-core.exe).Path
          python -m unittest discover -s tests/migration -p test_bridge_process.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run package:win
      - run: python tools/check_docs.py
      - run: node tests/electron/packaged-smoke.mjs
      - name: Create checksum and publish tested installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = Get-Content packaging/release.json | ConvertFrom-Json
          $installer = "artifacts/windows/LocalAgent-$($release.version)-setup-x64.exe"
          $checksum = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower() + '  ' + (Split-Path $installer -Leaf)
          [IO.File]::WriteAllText((Join-Path $PWD 'artifacts/windows/SHA256SUMS.txt'), $checksum + "`n", [Text.UTF8Encoding]::new($false))
          gh release create "v$($release.version)" $installer artifacts/windows/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "LocalAgent $($release.version) — Windows x64" --notes-file packaging/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LocalAgent-release-${{ github.sha }}
          path: |
            artifacts/windows/*-setup-x64.exe
            artifacts/windows/SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 14
