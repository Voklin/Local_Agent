name: Validate LocalAgent
on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests/migration -v
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - run: node tests/electron/desktop-apps.cjs
      - run: node tests/electron/microphone.cjs
      - run: node tests/electron/assistant-media.cjs
      - run: python tools/check_docs.py

  windows-package:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-build.txt
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: python tools/build_windows_core.py
      - name: Check frozen Core with isolated subprocess tests
        shell: pwsh
        run: |
          $env:LCA_TEST_CORE = (Resolve-Path build/core/lca-core/lca-core.exe).Path
          python -m unittest discover -s tests/migration -p test_bridge_process.py -v
      - run: python tools/prepare_windows_dependencies.py
      - run: npm run package:win
      - run: node tests/electron/packaged-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: LocalAgent-windows-x64-${{ github.sha }}
          path: artifacts/windows/*-setup-x64.exe
          if-no-files-found: error
          retention-days: 7
