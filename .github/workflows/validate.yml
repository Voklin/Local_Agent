name: Validate LESHY
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_visual:
        description: Run the full LESHY windows and theme matrix
        type: boolean
        default: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests/migration -v
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - run: node --test tests/electron/runner-exit.test.cjs
      - run: node --test tests/electron/packaged-path.test.mjs
      - run: npm run test:ide:state
      - run: node node_modules/electron/install.js
      - name: Set isolated test interpreter
        shell: pwsh
        run: |
          "LCA_TEST_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV
      - name: Check renderer, projects and extensions
        run: node tests/electron/run.cjs neutral-smoke.cjs
      - name: Check desktop layout
        run: node tests/electron/run.cjs studio-layout.cjs
      - run: node tests/electron/desktop-apps.cjs
      - run: node tests/electron/microphone.cjs
      - run: node tests/electron/assistant-media.cjs
      - run: python tools/check_docs.py

  windows-ide:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-core.txt
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node node_modules/electron/install.js
      - run: npm run build
      - name: Prepare pinned Code-OSS and isolated test environment
        shell: pwsh
        run: |
          "LCA_TEST_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV
          python prototypes/neutral-ide/prepare.py
      - run: node --test tests/electron/runner-exit.test.cjs
      - name: Native IDE, Core and editor
        timeout-minutes: 5
        run: node tests/electron/run.cjs neutral-ide-integration.cjs
      - name: Background chat isolation and cancellation
        timeout-minutes: 5
        run: node tests/electron/run.cjs background-runs-smoke.cjs
      - name: IDE acceptance checks and recovery
        timeout-minutes: 5
        run: npm run test:ui:acceptance
      - name: IDE acceptance checks with strict JSON
        timeout-minutes: 5
        run: npm run test:ui:acceptance:json
      - name: LESHY themes
        timeout-minutes: 5
        run: node tests/electron/run.cjs leshy-themes.cjs
      - name: Full visual matrix
        if: github.event_name == 'workflow_dispatch' && inputs.full_visual
        timeout-minutes: 5
        run: node tests/electron/run.cjs leshy-themes.cjs
        env:
          LESHY_WINDOWS_MATRIX: '1'
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LESHY-ide-evidence-${{ github.sha }}
          path: |
            .test-data/stage19/*.json
            .test-data/stage19/*.png
            .test-data/stage19/failure-dom.txt
            .test-data/background-gui/*.json
            .test-data/background-gui/*.png
            .test-data/background-gui/failure-dom.txt
            .test-data/ide-acceptance/*.json
            .test-data/ide-acceptance/*.png
            .test-data/ide-acceptance/failure-dom.txt
            .test-data/ide-acceptance-json/*.json
            .test-data/ide-acceptance-json/*.png
            .test-data/ide-acceptance-json/failure-dom.txt
            .test-data/stage19/profile-*/electron/logs/main.log
            .test-data/background-gui/profile-*/electron/logs/main.log
            .test-data/leshy-themes/profile-*/electron/logs/main.log
            .test-data/leshy-themes/*.json
            .test-data/leshy-themes/*.png
          if-no-files-found: warn
          retention-days: 7

  windows-package:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-build.txt
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: python tools/build_windows_core.py
      - name: Check frozen Core with isolated subprocess tests
        shell: pwsh
        run: |
          $env:LCA_TEST_CORE = (Resolve-Path build/core/lca-core/lca-core.exe).Path
          python -m unittest discover -s tests/migration -p test_bridge_process.py -v
      - run: python tools/prepare_windows_dependencies.py
      - run: npm run package:win
      - run: node tests/electron/packaged-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: LESHY-windows-x64-${{ github.sha }}
          path: artifacts/windows/*-setup-x64.exe
          if-no-files-found: error
          retention-days: 7
